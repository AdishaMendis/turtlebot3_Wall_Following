# All configurable controller settings. Distances: m; speeds: m/s or rad/s.
# Gains (and dual speed settings) support live changes; other settings need restart.
single_PID:
  ros__parameters:
    target: 0.3
    max_left: 0.5
    min_left: 0.2
    front_limit: 0.35
    front_rearm: 0.45
    front_left_limit: 0.22
    max_turn_speed: 0.5
    recovery_turn_speed: 0.22
    recovery_clear_distance: 0.45
    avoid_clear_distance: 0.25
    integral_limit: 0.2
    derivative_filter_time: 0.3
    pid_dt_min: 0.001
    pid_dt_max: 1.0
    corner_angle_deg: 90.0
    corner_kp: 1.5
    corner_max_turn_speed: 0.4
    corner_tolerance_deg: 2.0
    turn_timeout: 20.0
    recovery_timeout: 8.0
    sensor_timeout: 1.0
    watchdog_period: 0.1
    front_angle_deg: 0.0
    left_angle_deg: 90.0
    front_left_angle_deg: 45.0
    front_scan_half_width_deg: 12.0
    left_scan_half_width_deg: 3.0
    diagonal_scan_half_width_deg: 12.0
    log_directory: ~/wall_follower_logs
    kp: 1.0
    ki: 0.01
    kd: 0.5
    speed: 0.08
