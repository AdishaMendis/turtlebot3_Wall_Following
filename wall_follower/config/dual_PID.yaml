dual_PID:
  ros__parameters:
    # ---- wall geometry (m) ----
    target: 0.3
    max_left: 0.4
    min_left: 0.15
    recovery_clear_distance: 0.4
    avoid_clear_distance: 0.28

    # ---- front / corner detection (m) ----
    front_limit: 0.35
    front_left_limit: 0.22
    front_slowdown_start: 0.65

    # ---- right turn at a corner (LiDAR-based) ----
    corner_max_turn_speed: 0.4
    turn_exit_front: 0.8
    turn_min_time: 0.8
    turn_cooldown: 1.5
    turn_timeout: 20.0

    # ---- recovery behaviour ----
    recovery_turn_speed: 0.3
    recovery_linear: 0.03
    recovery_left_turn_speed: 0.25

    # ---- angular PID + wall-angle term (live tunable) ----
    kp: 1.5
    ki: 0.01
    kd: 0.3
    heading_kp: 1.2
    max_turn_speed: 0.8
    integral_limit: 0.2
    derivative_filter_time: 0.3
    pid_dt_min: 0.001
    pid_dt_max: 1.0

    # ---- linear speed PID (live tunable) ----
    kp_linear: 0.3
    ki_linear: 0.04
    kd_linear: 0.02
    minimum_speed: 0.07
    nominal_speed: 0.09
    maximum_speed: 0.1
    speed_integral_limit: 0.1
    speed_derivative_filter_time: 0.25
    wall_slowdown_error: 0.15
    wall_slowdown_fraction: 0.6
    front_min_speed_fraction: 0.4

    # ---- LiDAR geometry (deg) ----
    front_angle_deg: 0.0
    left_angle_deg: 90.0
    front_left_angle_deg: 45.0
    front_right_angle_deg: -45.0
    front_scan_half_width_deg: 12.0
    left_scan_half_width_deg: 3.0
    diagonal_scan_half_width_deg: 12.0

    # ---- timing / logging ----
    sensor_timeout: 1.0
    watchdog_period: 0.1
    status_log_period: 0.5
    log_directory: "~/wall_follower_logs"
